[pytest]
testpaths = tests
addopts =
    --strict-markers
markers =
    unit: Small-input unit tests for individual behaviors
    integration: File-level integration tests with temporary checkpoints
    e2e: Real-model loading, inference, and accuracy tests
    cpu: CPU-only tests
    gpu: Requires at least one available CUDA GPU
    multi_gpu: Requires at least two available CUDA GPUs and the gpu marker
    gptq: Calibration-based GPTQ tests; require the optional "gptq" extra
