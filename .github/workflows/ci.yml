name: CI Pipeline

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # Late reviews retrigger the gates; this event runs the base-branch workflow, so it takes effect after merge.
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  # Pushes supersede stale runs; review-triggered runs queue instead of cancelling active tests.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  precheck:
    name: Pre-check
    # Only verdict-changing reviews (human approval/request-changes or an AI bot review) retrigger the pipeline;
    # skipping the entry job skips every downstream job via needs.
    if: >-
      github.event_name != 'pull_request_review' ||
      github.event.review.state == 'approved' ||
      github.event.review.state == 'changes_requested' ||
      contains(fromJSON('["copilot-pull-request-reviewer[bot]", "copilot", "gemini-code-assist[bot]"]'), github.event.review.user.login)
    uses: t-head/.github/.github/workflows/user-precheck.yml@main
    secrets: inherit

  ai-code-review:
    name: AI Code Review (Copilot Gate)
    needs: precheck
    # The reusable gate needs write access to request Copilot itself; cluster test jobs stay read-only.
    permissions:
      contents: read
      pull-requests: write
    uses: t-head/.github/.github/workflows/ai-code-review.yml@main
    secrets: inherit

  human-review:
    name: Human Review Gate
    needs: ai-code-review
    uses: t-head/.github/.github/workflows/human-review.yml@main
    secrets: inherit

  cpu-test:
    name: CPU Test
    needs: human-review
    runs-on: k8s-runner-group-cpu-thead
    container:
      image: ghcr.io/actions/actions-runner:latest
    timeout-minutes: 100
    env:
      QLEAN_PPU_IMAGE: ${{ vars.QLEAN_PPU_IMAGE }}
      QLEAN_PPU_NAMESPACE: ${{ vars.QLEAN_PPU_NAMESPACE }}
      QLEAN_REPORT_RUNNER_ROOT: ${{ vars.QLEAN_REPORT_RUNNER_ROOT }}
      QLEAN_PPU_JIT_APPROVED: ${{ vars.QLEAN_PPU_JIT_APPROVED }}
      QLEAN_PR_TRUST_APPROVED: ${{ vars.QLEAN_PR_TRUST_APPROVED }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate cluster prerequisites
        shell: bash
        env:
          QLEAN_CPU_PYTHON: ${{ vars.QLEAN_CPU_PYTHON }}
          QLEAN_REPORT_ROOT: ${{ vars.QLEAN_REPORT_ROOT }}
        run: |
          set -euo pipefail
          test -n "$QLEAN_PPU_IMAGE"
          test -n "$QLEAN_PPU_NAMESPACE"
          test -n "$QLEAN_CPU_PYTHON"
          case "$QLEAN_CPU_PYTHON$QLEAN_REPORT_ROOT" in *','*|*$'\n'*|*$'\r'*) exit 1 ;; esac
          test "$QLEAN_PPU_JIT_APPROVED" = approved
          test "$QLEAN_PR_TRUST_APPROVED" = approved
          case "$QLEAN_REPORT_ROOT" in /mnt/wl_nas/*|/nas_aisw/*) ;; *) exit 1 ;; esac
          test -n "$QLEAN_REPORT_RUNNER_ROOT"
          mkdir -p "$QLEAN_REPORT_RUNNER_ROOT"
          test -d "$QLEAN_REPORT_RUNNER_ROOT"
          test -w "$QLEAN_REPORT_RUNNER_ROOT"
      - name: Run CPU install check and suite on 810E
        id: cpu
        uses: t-head/ci-infra/cluster-run@main
        with:
          image: ${{ vars.QLEAN_PPU_IMAGE }}
          namespace: ${{ vars.QLEAN_PPU_NAMESPACE }}
          job_suffix: cpu
          timeout_minutes: '60'
          extra_env: "QLEAN_CPU_PYTHON=${{ vars.QLEAN_CPU_PYTHON }},QLEAN_REPORT_ROOT=${{ vars.QLEAN_REPORT_ROOT }},QLEAN_RUN_KEY=${{ github.run_id }}-${{ github.run_attempt }}"
          nnodes: '0'
          nproc_per_node: '1'
          node_selector: 'board-type=ZW-810E'
          source_dir: /workspace/source
          cleanup_policy: always
          dmesg_policy: never
          command: |
            set -euo pipefail
            test -x "$QLEAN_CPU_PYTHON"
            test -d "$QLEAN_REPORT_ROOT"
            test -w "$QLEAN_REPORT_ROOT"
            out="$QLEAN_REPORT_ROOT/qlean-cpu-$QLEAN_RUN_KEY"
            scratch="$(mktemp -d /tmp/qlean-cpu-XXXXXX)"
            cleanup() {
              mkdir -p "$out"
              (cd "$scratch" && tar cf - --exclude=./venv --exclude=./wheel --exclude=./cache --exclude=./tmp --exclude='*triton_cache' --exclude='*hf_cache' --exclude='*torch_cache' .) | (cd "$out" && tar xf -)
              rm -rf "$scratch"
              chmod -R a+rX "$out" 2>/dev/null || true
            }
            trap cleanup EXIT
            "$QLEAN_CPU_PYTHON" -I -B /workspace/source/tests/check_install.py --constraints /workspace/source/ci/cpu-constraints.txt --output "$scratch"
      - name: Require successful terminal state
        if: always()
        shell: bash
        env:
          CPU_STATUS: ${{ steps.cpu.outputs.job_status }}
        run: |
          test "$CPU_STATUS" = succeeded
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpu-reports
          path: |
            ${{ vars.QLEAN_REPORT_RUNNER_ROOT }}/qlean-cpu-${{ github.run_id }}-${{ github.run_attempt }}/*.json
            ${{ vars.QLEAN_REPORT_RUNNER_ROOT }}/qlean-cpu-${{ github.run_id }}-${{ github.run_attempt }}/*.log
            ${{ vars.QLEAN_REPORT_RUNNER_ROOT }}/qlean-cpu-${{ github.run_id }}-${{ github.run_attempt }}/constraints.txt
            ${{ vars.QLEAN_REPORT_RUNNER_ROOT }}/qlean-cpu-${{ github.run_id }}-${{ github.run_attempt }}/source_snapshot.tar.gz
            ${{ vars.QLEAN_REPORT_RUNNER_ROOT }}/qlean-cpu-${{ github.run_id }}-${{ github.run_attempt }}/cpu/*.json
            ${{ vars.QLEAN_REPORT_RUNNER_ROOT }}/qlean-cpu-${{ github.run_id }}-${{ github.run_attempt }}/cpu/*.xml
            ${{ vars.QLEAN_REPORT_RUNNER_ROOT }}/qlean-cpu-${{ github.run_id }}-${{ github.run_attempt }}/cpu/*.log
            ${{ vars.QLEAN_REPORT_RUNNER_ROOT }}/qlean-cpu-${{ github.run_id }}-${{ github.run_attempt }}/cpu/constraints.txt
            ${{ vars.QLEAN_REPORT_RUNNER_ROOT }}/qlean-cpu-${{ github.run_id }}-${{ github.run_attempt }}/cpu/tmp/**/*.log
          if-no-files-found: error

  ppu-ci:
    name: ppu-ci
    needs: human-review
    runs-on: k8s-runner-group-cpu-thead
    container:
      image: ghcr.io/actions/actions-runner:latest
    timeout-minutes: 150
    env:
      QLEAN_PPU_IMAGE: ${{ vars.QLEAN_PPU_IMAGE }}
      QLEAN_PPU_NAMESPACE: ${{ vars.QLEAN_PPU_NAMESPACE }}
      QLEAN_REPORT_RUNNER_ROOT: ${{ vars.QLEAN_REPORT_RUNNER_ROOT }}
      QLEAN_PPU_JIT_APPROVED: ${{ vars.QLEAN_PPU_JIT_APPROVED }}
      QLEAN_PR_TRUST_APPROVED: ${{ vars.QLEAN_PR_TRUST_APPROVED }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate cluster prerequisites
        shell: bash
        env:
          QLEAN_PPU_PYTHON: ${{ vars.QLEAN_PPU_PYTHON }}
          QLEAN_REPORT_ROOT: ${{ vars.QLEAN_REPORT_ROOT }}
        run: |
          set -euo pipefail
          test -n "$QLEAN_PPU_IMAGE"
          test -n "$QLEAN_PPU_NAMESPACE"
          test -n "$QLEAN_PPU_PYTHON"
          case "$QLEAN_PPU_PYTHON$QLEAN_REPORT_ROOT" in *','*|*$'\n'*|*$'\r'*) exit 1 ;; esac
          test "$QLEAN_PPU_JIT_APPROVED" = approved
          test "$QLEAN_PR_TRUST_APPROVED" = approved
          case "$QLEAN_REPORT_ROOT" in /mnt/wl_nas/*|/nas_aisw/*) ;; *) exit 1 ;; esac
          test -n "$QLEAN_REPORT_RUNNER_ROOT"
          mkdir -p "$QLEAN_REPORT_RUNNER_ROOT"
          test -d "$QLEAN_REPORT_RUNNER_ROOT"
          test -w "$QLEAN_REPORT_RUNNER_ROOT"
      - name: Run single-device 810E regression
        id: ppu
        uses: t-head/ci-infra/cluster-run@main
        with:
          image: ${{ vars.QLEAN_PPU_IMAGE }}
          namespace: ${{ vars.QLEAN_PPU_NAMESPACE }}
          job_suffix: single
          timeout_minutes: '60'
          extra_env: "QLEAN_PPU_PYTHON=${{ vars.QLEAN_PPU_PYTHON }},QLEAN_REPORT_ROOT=${{ vars.QLEAN_REPORT_ROOT }},QLEAN_RUN_KEY=${{ github.run_id }}-${{ github.run_attempt }}"
          nnodes: '0'
          nproc_per_node: '1'
          node_selector: 'board-type=ZW-810E'
          source_dir: /workspace/source
          cleanup_policy: always
          dmesg_policy: never
          command: |
            set -euo pipefail
            test -x "$QLEAN_PPU_PYTHON"
            test -d "$QLEAN_REPORT_ROOT"
            test -w "$QLEAN_REPORT_ROOT"
            out="$QLEAN_REPORT_ROOT/qlean-ppu-$QLEAN_RUN_KEY"
            trap 'rm -rf "$out/triton_cache" "$out/hf_cache" "$out/torch_cache" 2>/dev/null; chmod -R a+rX "$out" 2>/dev/null || true' EXIT
            "$QLEAN_PPU_PYTHON" -B -m pip install --no-cache-dir --disable-pip-version-check -i https://download.t-head.cn/artifactory/api/pypi/pypi_index/simple -c /workspace/source/ci/ppu-constraints.txt transformers huggingface-hub safetensors pydantic compressed-tensors PyYAML pytest
            "$QLEAN_PPU_PYTHON" -I -B /workspace/source/tests/run_checks.py --suite ppu --constraints /workspace/source/ci/ppu-constraints.txt --output "$out"
      - name: Run minimal dual-device 810E regression
        id: ppu_dual
        uses: t-head/ci-infra/cluster-run@main
        with:
          image: ${{ vars.QLEAN_PPU_IMAGE }}
          namespace: ${{ vars.QLEAN_PPU_NAMESPACE }}
          job_suffix: dual
          timeout_minutes: '60'
          extra_env: "QLEAN_PPU_PYTHON=${{ vars.QLEAN_PPU_PYTHON }},QLEAN_REPORT_ROOT=${{ vars.QLEAN_REPORT_ROOT }},QLEAN_RUN_KEY=${{ github.run_id }}-${{ github.run_attempt }}"
          nnodes: '0'
          nproc_per_node: '2'
          node_selector: 'board-type=ZW-810E'
          source_dir: /workspace/source
          cleanup_policy: always
          dmesg_policy: never
          command: |
            set -euo pipefail
            test -x "$QLEAN_PPU_PYTHON"
            test -d "$QLEAN_REPORT_ROOT"
            test -w "$QLEAN_REPORT_ROOT"
            out="$QLEAN_REPORT_ROOT/qlean-ppu-dual-$QLEAN_RUN_KEY"
            trap 'rm -rf "$out/triton_cache" "$out/hf_cache" "$out/torch_cache" 2>/dev/null; chmod -R a+rX "$out" 2>/dev/null || true' EXIT
            "$QLEAN_PPU_PYTHON" -B -m pip install --no-cache-dir --disable-pip-version-check -i https://download.t-head.cn/artifactory/api/pypi/pypi_index/simple -c /workspace/source/ci/ppu-constraints.txt transformers huggingface-hub safetensors pydantic compressed-tensors PyYAML pytest
            "$QLEAN_PPU_PYTHON" -I -B /workspace/source/tests/run_checks.py --suite ppu-dual --constraints /workspace/source/ci/ppu-constraints.txt --output "$out"
      - name: Require successful terminal states
        if: always()
        shell: bash
        env:
          PPU_STATUS: ${{ steps.ppu.outputs.job_status }}
          DUAL_STATUS: ${{ steps.ppu_dual.outputs.job_status }}
        run: |
          test "$PPU_STATUS" = succeeded
          test "$DUAL_STATUS" = succeeded
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ppu-reports
          path: |
            ${{ vars.QLEAN_REPORT_RUNNER_ROOT }}/qlean-ppu-${{ github.run_id }}-${{ github.run_attempt }}/*.json
            ${{ vars.QLEAN_REPORT_RUNNER_ROOT }}/qlean-ppu-${{ github.run_id }}-${{ github.run_attempt }}/*.xml
            ${{ vars.QLEAN_REPORT_RUNNER_ROOT }}/qlean-ppu-${{ github.run_id }}-${{ github.run_attempt }}/*.log
            ${{ vars.QLEAN_REPORT_RUNNER_ROOT }}/qlean-ppu-dual-${{ github.run_id }}-${{ github.run_attempt }}/*.json
            ${{ vars.QLEAN_REPORT_RUNNER_ROOT }}/qlean-ppu-dual-${{ github.run_id }}-${{ github.run_attempt }}/*.xml
            ${{ vars.QLEAN_REPORT_RUNNER_ROOT }}/qlean-ppu-dual-${{ github.run_id }}-${{ github.run_attempt }}/*.log
            ${{ vars.QLEAN_REPORT_RUNNER_ROOT }}/qlean-ppu-dual-${{ github.run_id }}-${{ github.run_attempt }}/tmp/**/*.log
            ${{ vars.QLEAN_REPORT_RUNNER_ROOT }}/qlean-ppu-dual-${{ github.run_id }}-${{ github.run_attempt }}/tmp/**/*-trace/*.json*
          if-no-files-found: error
